services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_ROOT_PASSWORD}
      MSSQL_DB: ${DB_NAME}
      MSSQL_USER: ${DB_APP_USER}
      MSSQL_PASSWORD: ${DB_APP_PASSWORD}
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_COLLATION: Latin1_General_100_CI_AI_SC_UTF8
      TZ: UTC
    volumes:
      - ./compose/sqlserver/entrypoint.sh:/usr/local/bin/custom-entrypoint.sh:ro
      - ./maintain/functions.sh:/usr/local/bin/functions.sh:ro
      - sqlserver_server_data:/var/opt/mssql
      - ./var/log/compose/sqlserver:/var/opt/mssql/log
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U \"$$MSSQL_USER\" -P \"$$MSSQL_PASSWORD\" -d \"$$MSSQL_DB\" -C -Q \"SELECT 1\" -b -o /dev/null && test -f /var/opt/mssql/init.done"]
      start_period: 3m
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    user: root
    entrypoint: ["bash", "custom-entrypoint.sh"]
    command: ["/opt/mssql/bin/sqlservr"]

  wrapper:
    depends_on:
      sqlserver:
        condition: service_healthy
        restart: true
    volumes:
      - sqlserver_server_data:/var/lib/db_engine

volumes:
  sqlserver_server_data:
